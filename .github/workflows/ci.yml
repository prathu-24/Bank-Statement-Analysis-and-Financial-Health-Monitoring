name: FinSight CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Pytest & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff pytest pytest-asyncio

      - name: Code Quality & Lint Check (Ruff)
        run: |
          ruff check backend/ --exclude backend/tests/ --ignore E501,E402,F401,F841 || true

      - name: Run Backend Pytest Suite
        run: |
          cd backend
          python -m pytest tests -v

      - name: Verify Automated Persona Evaluation
        run: |
          export PYTHONPATH=backend
          python scripts/evaluate.py

  frontend-build:
    name: Frontend Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Run Frontend Production Build
        run: |
          cd frontend
          npm run build
